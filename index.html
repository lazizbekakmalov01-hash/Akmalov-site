<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Saytim | 5TB Drive va 3D O'yin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .file-upload-wrapper {
            position: relative;
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none;
        }
        label {
            display: block;
            padding: 20px;
            background-color: #f9fafb;
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            color: #6b7280;
            transition: all 0.3s;
        }
        label:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2563eb;
        }
        #statusDiv {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        
        /* 3D O'yin uslublari */
        .section-title {
            color: #1f2937;
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #fps-game-container {
            width: 100%;
            max-width: 800px;
            height: 450px;
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffcc;
            font-size: 28px;
            pointer-events: none;
            user-select: none;
        }
        #fps-score {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #fff;
            font-family: monospace;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 8px;
            z-index: 10;
        }
        .game-hint {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: #aaa;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- 1-QISM: FAYL YUKLASH BO'LIMI -->
    <div class="container">
        <h1>Google Drive'ga Fayl Yuklash</h1>
        <div class="file-upload-wrapper">
            <input type="file" id="fileInput" onchange="updateLabel()">
            <label id="file-label" for="fileInput">Faylni tanlang yoki shu yerga tashlang</label>
        </div>
        <button onclick="uploadFile()">Yuborish</button>
        <div id="statusDiv"></div>
    </div>

    <!-- 2-QISM: 3D FPS O'YIN BO'LIMI -->
    <div class="section-title">Nishonga Otish 3D O'yini</div>
    <div id="fps-game-container">
        <div id="crosshair">+</div>
        <div id="fps-score">Ball: 0</div>
        <div class="game-hint">Kvadratlarni sichqoncha bilan bosing (o'q uzing)!</div>
    </div>

    <!-- SKRIPTLAR BO'LIMI -->
    
    <!-- Fayl yuklash skripti -->
    <script>
        function updateLabel() {
            const fileInput = document.getElementById('fileInput');
            const label = document.getElementById('file-label');
            if (fileInput.files.length > 0) {
                label.innerText = fileInput.files[0].name;
            } else {
                label.innerText = "Faylni tanlang yoki shu yerga tashlang";
            }
        }

        function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const statusDiv = document.getElementById('statusDiv');
            
            if (fileInput.files.length === 0) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = "Iltimos, avval fayl tanlang!";
                return;
            }

            const file = fileInput.files[0];
            statusDiv.style.color = '#38bdf8';
            statusDiv.innerText = "Yuklanmoqda, iltimos kuting...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function () {
                const rawData = reader.result.split(',')[1];
                const data = {
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: rawData
                };

                // O'zingizning Google Apps Script havolangiz (If sharti olib tashlangan holda ulanmoqda)
                const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2QT4Ek6XthjD7rcAecYcKvZ2R_ehrC6_KYZRnBmvLjkmttd2chYYDFCbAZaVRnIqU/exec";

                fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                })
                .then(res => res.text())
                .then(response => {
                    statusDiv.style.color = '#10b981';
                    statusDiv.innerText = "Muvaffaqiyatli yuborildi! 5 TB Drive'ingizga tushdi ✅";
                    fileInput.value = "";
                    document.getElementById('file-label').innerText = "Faylni tanlang yoki shu yerga tashlang";
                })
                .catch(error => {
                    statusDiv.style.color = '#ef4444';
                    statusDiv.innerText = "Xatolik yuz berdi. Qaytadan urinib ko'ring.";
                });
            };
        }
    </script>

    <!-- Three.js kutubxonasi va 3D O'yin skripti -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('fps-game-container');
        let score = 0;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5).normalize();
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        let target;
        function spawnTarget() {
            if (target) scene.remove(target);
            const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const material = new THREE.MeshLambertMaterial({ color: Math.random() * 0xffffff });
            target = new THREE.Mesh(geometry, material);
            target.position.x = (Math.random() - 0.5) * 6;
            target.position.y = (Math.random() - 0.5) * 4;
            target.position.z = (Math.random() - 0.5) * 4 - 2;
            scene.add(target);
        }
        spawnTarget();

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        container.addEventListener('click', (event) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);
            
            if (intersects.length > 0 && intersects[0].object === target) {
                score += 10;
                document.getElementById('fps-score').innerText = "Ball: " + score;
                spawnTarget();
            }
        });

        window.addEventListener('resize', () => {
            if(container) {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (target) {
                target.rotation.x += 0.01;
                target.rotation.y += 0.02;
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
