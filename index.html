<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akmalov.site</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .stats-box {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: left;
      font-size: 14px;
      line-height: 1.8;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stats-box div {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
      padding: 4px 0;
    }
    .stats-box div:last-child {
      border-bottom: none;
    }
    .label {
      color: #94a3b8;
    }
    .value {
      color: #e2e8f0;
      font-weight: 600;
    }
    .counter-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 22px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 999px;
      color: #38bdf8;
      font-weight: 600;
      font-size: 15px;
    }
    .status-dot {
      font-size: 12px;
      color: #64748b;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Akmalov.site</h1>
    <p class="subtitle">Xush kelibsiz! Saytimizga tashrifingiz qayd etildi.</p>

    <div class="stats-box">
      <div><span class="label">🌐 IP Manzil:</span> <span class="value" id="ui-ip">Aniqlanmoqda...</span></div>
      <div><span class="label">📍 Manzil:</span> <span class="value" id="ui-loc">Aniqlanmoqda...</span></div>
      <div><span class="label">📡 Provayder:</span> <span class="value" id="ui-isp">Aniqlanmoqda...</span></div>
      <div><span class="label">🖥 Ekran / RAM:</span> <span class="value" id="ui-screen">Aniqlanmoqda...</span></div>
    </div>

    <div class="counter-badge">
      👁 Jami tashriflar: <span id="visit-count">...</span>
    </div>

    <p class="status-dot" id="send-status">⏳ Ma'lumot yuborilmoqda...</p>
  </div>

  <!-- ========================================== -->
  <!-- GEO + TELEGRAM + GOOGLE SHEETS TRACKER KODI -->
  <!-- ========================================== -->
  <script>
  async function trackVisitor() {
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9az55tRrGzbNlQj1SsVdeHEhMhQwbbZmQjdU3EzKTpvlmuonrg2Rt1Lfz_uuLEVw/exec";

    let geo = {
      ip: "Noma'lum",
      country: "Noma'lum",
      city: "Noma'lum",
      isp: "Noma'lum",
      lat: "",
      lon: ""
    };

    // 1-urinish: ipwho.is (Tez va bloklanmaydi)
    try {
      const res1 = await fetch("https://ipwho.is/");
      const d1 = await res1.json();
      if (d1 && d1.success) {
        geo.ip = d1.ip;
        geo.country = d1.country;
        geo.city = d1.city;
        geo.isp = (d1.connection && (d1.connection.isp || d1.connection.org)) || "Noma'lum";
        geo.lat = d1.latitude || "";
        geo.lon = d1.longitude || "";
      }
    } catch (e) {}

    // 2-urinish (Zaxira): ipapi.co
    if (geo.ip === "Noma'lum") {
      try {
        const res2 = await fetch("https://ipapi.co/json/");
        const d2 = await res2.json();
        if (d2 && d2.ip) {
          geo.ip = d2.ip;
          geo.country = d2.country_name || "Noma'lum";
          geo.city = d2.city || "Noma'lum";
          geo.isp = d2.org || "Noma'lum";
          geo.lat = d2.latitude || "";
          geo.lon = d2.longitude || "";
        }
      } catch (e) {}
    }

    // 3-urinish (Zaxira): ipify
    if (geo.ip === "Noma'lum") {
      try {
        const res3 = await fetch("https://api.ipify.org?format=json");
        const d3 = await res3.json();
        if (d3 && d3.ip) geo.ip = d3.ip;
      } catch (e) {}
    }

    // Batareya foizi va Tarmoq turi (4G / Wi-Fi)
    let batteryInfo = "Yopiq (iOS/Safari)";
    try {
      if (navigator.getBattery) {
        const bat = await navigator.getBattery();
        batteryInfo = Math.round(bat.level * 100) + "%" + (bat.charging ? " ⚡️ (Zaryadda)" : "");
      }
    } catch (e) {}

    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn && conn.effectiveType) {
      batteryInfo += ` | 📶 ${conn.effectiveType.toUpperCase()}`;
    }

    // Ekran o'lchami + Xotira (RAM) va Protsessor yadrosi
    let screenInfo = `${window.screen.width}x${window.screen.height}`;
    let hwDetails = [];
    if (navigator.deviceMemory) hwDetails.push(`${navigator.deviceMemory}GB RAM`);
    if (navigator.hardwareConcurrency) hwDetails.push(`${navigator.hardwareConcurrency} yadro`);
    if (hwDetails.length > 0) {
      screenInfo += ` (${hwDetails.join(", ")})`;
    }

    // Qayerdan kelganligini aniqlash (Referrer / UTM)
    const urlParams = new URLSearchParams(window.location.search);
    const utmSource = urlParams.get("utm_source") || urlParams.get("from") || urlParams.get("ref") || "";
    let referrerSource = document.referrer || "To'g'ridan-to'g'ri (Direct)";
    if (utmSource) {
      referrerSource = "Maxsus ssilka (" + utmSource + ")";
    } else if (/Telegram/i.test(navigator.userAgent)) {
      referrerSource = "Telegram ilovasi ✈️";
    } else if (/Instagram/i.test(navigator.userAgent)) {
      referrerSource = "Instagram ilovasi 📸";
    }

    // Ekrandagi UI elementlarni to'ldirish (agar sahifada bor bo'lsa)
    const elIp = document.getElementById("ui-ip");
    const elLoc = document.getElementById("ui-loc");
    const elIsp = document.getElementById("ui-isp");
    const elScreen = document.getElementById("ui-screen");
    const elStatus = document.getElementById("send-status");

    if (elIp) elIp.textContent = geo.ip;
    if (elLoc) elLoc.textContent = `${geo.country}, ${geo.city}`;
    if (elIsp) elIsp.textContent = geo.isp;
    if (elScreen) elScreen.textContent = screenInfo;

    // Google Apps Script uchun URL parametrlar
    const params = new URLSearchParams({
      ip: geo.ip,
      country: geo.country,
      city: geo.city,
      isp: geo.isp,
      lat: geo.lat,
      lon: geo.lon,
      userAgent: navigator.userAgent,
      screen: screenInfo,
      language: navigator.language || "Noma'lum",
      battery: batteryInfo,
      referrer: referrerSource,
      page: window.location.pathname + window.location.search
    });

    try {
      const response = await fetch(`${SCRIPT_URL}?${params.toString()}`);
      const result = await response.json();

      const counterEl = document.getElementById("visit-count") || document.getElementById("visits");
      if (counterEl && result.visits) {
        counterEl.textContent = result.visits;
      }
      if (elStatus) elStatus.textContent = "✅ Statistikaga muvaffaqiyatli yozildi!";
    } catch (err) {
      // Agar CORS cheklovi bo'lsa ham, no-cors orqali Telegramga 100% yetkazadi
      fetch(`${SCRIPT_URL}?${params.toString()}`, { mode: "no-cors" });
      if (elStatus) elStatus.textContent = "✅ Telegramga yuborildi!";
    }
  }

  window.addEventListener("DOMContentLoaded", trackVisitor);
  </script>

</body>
</html>
